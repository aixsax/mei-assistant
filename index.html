<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mei Assistant - Flörtöz Yapay Zeka</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-slate-800 p-4 shadow-md text-center border-b border-slate-700">
        <h1 class="text-xl font-bold text-pink-400">💖 Mei Assistant</h1>
        <p class="text-xs text-slate-400">Senin için özel hazırlanmış yapay zeka asistanı</p>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-slate-800 text-pink-200 p-3 rounded-2xl max-w-xs text-sm shadow">
                Selam! Sensiz biraz eksiktim ama şimdi harikayım. Bugün nasıl geçiyor? ✨
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="bg-slate-800 p-4 border-t border-slate-700">
        <div class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="Mei'ye bir şeyler yaz..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-pink-500">
            <button onclick="sendMessage()" class="bg-pink-600 hover:bg-pink-500 px-5 py-2 rounded-xl text-sm font-semibold transition">Gönder</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = input.value.trim();
            if (!text) return;

            // Kullanıcı mesajı
            container.innerHTML += `<div class="flex justify-end"><div class="bg-pink-600 text-white p-3 rounded-2xl max-w-xs text-sm shadow">${text}</div></div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // Yükleniyor efekti
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div id="${loadingId}" class="flex justify-start"><div class="bg-slate-800 text-slate-400 p-3 rounded-2xl text-sm">Mei yazıyor... 💭</div></div>`;
            container.scrollTop = container.scrollHeight;

            try {
                // Şimdilik test amaçlı örnek yanıt sistemi (Dilerseniz kendi API'nize bağlayabilirsiniz)
                setTimeout(() => {
                    document.getElementById(loadingId).remove();
                    container.innerHTML += `<div class="flex justify-start"><div class="bg-slate-800 text-pink-200 p-3 rounded-2xl max-w-xs text-sm shadow">Aşkım harika konuşuyorsun, seni dinliyorum! 💕</div></div>`;
                    container.scrollTop = container.scrollHeight;
                }, 1000);
            } catch (err) {
                document.getElementById(loadingId).remove();
                container.innerHTML += `<div class="flex justify-start"><div class="bg-slate-800 text-red-400 p-3 rounded-2xl text-sm">Bir hata oluştu.</div></div>`;
            }
        }
    </script>
</body>
</html>

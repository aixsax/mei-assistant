<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mei Assistant | Akıllı Yapay Zeka</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background: #111827; padding: 15px 25px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.3rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        #durum { font-size: 0.82rem; color: #4ade80; background: #1e293b; padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; }
        #sohbet-alani { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; width: 100%; margin: 0 auto; }
        .mesaj { padding: 14px 18px; border-radius: 12px; max-width: 82%; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .kullanici { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #1e293b; border: 1px solid #334155; align-self: flex-start; border-bottom-left-radius: 2px; }
        .etiket { display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; background: #0f172a; color: #38bdf8; border: 1px solid #1e3a8a; font-weight: 600; }
        .alt-panel { background: #111827; padding: 15px 20px; border-top: 1px solid #1f2937; }
        .girdi-kutusu { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #374151; background: #0b0f19; color: white; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { padding: 12px 24px; background: #38bdf8; color: #0b0f19; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>🤖 Mei Assistant</h1>
        <div id="durum">● 3 Kütüphane Aktif ve Hazır</div>
    </header>

    <div id="sohbet-alani">
        <div class="mesaj bot">
            <div class="etiket">Sistem Aktif</div><br>
            Merhaba! Ben <b>Mei Assistant</b>. Sorularını yanıtlamak için 3 katmanlı yapay zeka ve bilgi kütüphanemle hazırım. Bana istediğini sorabilirsin!
        </div>
    </div>

    <div class="alt-panel">
        <div class="girdi-kutusu">
            <input type="text" id="mesaj-input" placeholder="Mesajınızı buraya yazın..." autofocus>
            <button id="gonder-btn">Gönder</button>
        </div>
    </div>

    <script>
        const sohbetAlani = document.getElementById('sohbet-alani');
        const inputEl = document.getElementById('mesaj-input');
        const btnEl = document.getElementById('gonder-btn');
        const durumEl = document.getElementById('durum');

        // 1. KÜTÜPHANE: Gömülü Çekirdek Eğitim Verisi (Dosya yüklenmese bile %100 çalışır)
        let egitimVerisi = [
            { soru: "merhaba", cevap: "Merhaba! Ben Mei Assistant. Bugün sana nasıl yardımcı olabilirim?", kaynak: "1. Kütüphane: Çekirdek Beyin" },
            { soru: "selam", cevap: "Selam! Hoş geldin, ne üzerine konuşmak istersin?", kaynak: "1. Kütüphane: Çekirdek Beyin" },
            { soru: "nasılsın", cevap: "Teşekkür ederim, tüm sistemlerim harika çalışıyor! Sen nasılsın, nasıl gidiyor?", kaynak: "1. Kütüphane: Çekirdek Beyin" },
            { soru: "naber", cevap: "İyilik, her şey yolunda! Senden naber?", kaynak: "1. Kütüphane: Çekirdek Beyin" },
            { soru: "sen kimsin", cevap: "Ben **Mei Assistant**! Volkan Yücekaya tarafından geliştirilen ve çoklu kütüphane mimarisiyle çalışan akıllı bir yapay zeka asistanıyım.", kaynak: "1. Kütüphane: Özel Kimlik" },
            { soru: "seni kim yaptı", cevap: "Beni **Volkan Yücekaya (AİXBEY LTD)** geliştirdi ve eğitti.", kaynak: "1. Kütüphane: Özel Kimlik" },
            { soru: "adın ne", cevap: "Benim adım Mei Assistant.", kaynak: "1. Kütüphane: Özel Kimlik" },
            { soru: "ne işe yararsın", cevap: "Sorularını yanıtlayabilir, kavramları açıklayabilir, yazılım ve teknoloji konularında bilgi verebilir ve seninle sohbet edebilirim.", kaynak: "1. Kütüphane: Çekirdek Beyin" },
            { soru: "teşekkür ederim", cevap: "Rica ederim! Başka bir sorun olursa her zaman buradayım.", kaynak: "1. Kütüphane: Çekirdek Beyin" },
            { soru: "görüşürüz", cevap: "Görüşmek üzere! Kendine çok iyi bak.", kaynak: "1. Kütüphane: Çekirdek Beyin" },
            { soru: "yapay zeka nedir", cevap: "Yapay zeka (AI), insan zekasını taklit eden, öğrenebilen, problem çözebilen ve karar verebilen bilgisayar sistemleridir.", kaynak: "1. Kütüphane: Colab Eğitimi" },
            { soru: "python nedir", cevap: "Python; okunabilirliği yüksek, yapay zeka, veri bilimi, web ve otomasyon geliştirmede dünyanın en popüler programlama dillerinden biridir.", kaynak: "1. Kütüphane: Colab Eğitimi" },
            { soru: "github nedir", cevap: "GitHub, yazılımcıların projelerini sakladığı, versiyon kontrolü yaptığı ve dünyayla paylaştığı en büyük kod barındırma platformudur.", kaynak: "1. Kütüphane: Colab Eğitimi" }
        ];

        let fuse = new Fuse(egitimVerisi, { keys: ['soru'], threshold: 0.35 });

        // Harici veriseti.json dosyasını da üstüne ekle (Colab'den gelen tüm veriler)
        async function hariciVeriyiYukle() {
            try {
                const res = await fetch('./veriseti.json?v=' + Date.now());
                if (res.ok) {
                    const disVeri = await res.json();
                    if (Array.isArray(disVeri)) {
                        egitimVerisi = [...egitimVerisi, ...disVeri];
                        fuse = new Fuse(egitimVerisi, { keys: ['soru'], threshold: 0.35 });
                        durumEl.innerText = `● Aktif (${egitimVerisi.length} Eğitilmiş Bilgi + Canlı Motor)`;
                    }
                }
            } catch (e) {
                console.log("Yalnızca gömülü kütüphane aktif.");
            }
        }
        hariciVeriyiYukle();

        // 2. KÜTÜPHANE: Akıllı Bilgi Bankası (Sadece gerçek bilgi sorularında devreye girer)
        async function bilgiBankasiAra(soru) {
            try {
                // Günlük sohbet kelimelerinde Wikipedia'ya gitmesini engelle
                const sohbetKelimeleri = ["merhaba", "selam", "naber", "nasılsın", "hey", "iyi", "kötü", "tamam", "evet", "hayır"];
                if (sohbetKelimeleri.includes(soru.toLowerCase())) return null;

                const temiz = soru.replace(/nedir|kimdir|ne demek|hakkında bilgi|nerededir|ne zaman/gi, '').trim();
                if (temiz.length < 2) return null;

                const url = `https://tr.wikipedia.org/w/api.php?action=query&prop=extracts&exintro&explaintext&redirects=1&titles=${encodeURIComponent(temiz)}&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                const pages = data?.query?.pages;
                if (pages) {
                    const pageId = Object.keys(pages)[0];
                    if (pageId !== "-1" && pages[pageId].extract) {
                        return `**${pages[pageId].title}:**\n\n` + pages[pageId].extract.split('\n')[0];
                    }
                }

                // Doğrudan başlık bulunamazsa arama yap
                const searchUrl = `https://tr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(temiz)}&format=json&origin=*`;
                const sRes = await fetch(searchUrl);
                const sData = await sRes.json();
                if (sData?.query?.search?.length > 0) {
                    const ilk = sData.query.search[0];
                    const temizOzet = ilk.snippet.replace(/<[^>]*>?/gm, '');
                    return `**${ilk.title}:** ${temizOzet}...`;
                }
            } catch (e) {}
            return null;
        }

        // 3. KÜTÜPHANE: Dinamik Mantık ve Cümle Üretim Motoru (Her soruya mantıklı yanıt üretir)
        function mantikMotoru(soru) {
            const kucuk = soru.toLowerCase();
            if (kucuk.includes("saat kaç")) return `Şu an sistem saati: **${new Date().toLocaleTimeString('tr-TR')}**`;
            if (kucuk.includes("hangi gün") || kucuk.includes("tarih")) return `Bugünün tarihi: **${new Date().toLocaleDateString('tr-TR')}**`;
            if (kucuk.match(/^[0-9+\-*/().\s]+$/)) {
                try { return `Matematiksel işlem sonucu: **${ Function('"use strict";return (' + soru + ')')() }**`; } catch(e){}
            }
            return `Bunun üzerine düşünüyorum: **"${soru}"**. Eğer bu konuda bana özel bir bilgi öğretmek istersen Colab eğitim dosyamıza ekleyebilirsin veya bana *"${soru} nedir?"* şeklinde sorarak bilgi kütüphanemi taratabilirsin!`;
        }

        function mesajEkle(metin, kim, kaynak = '') {
            const div = document.createElement('div');
            div.className = `mesaj ${kim}`;
            div.innerHTML = (kaynak ? `<div class="etiket">${kaynak}</div><br>` : '') + marked.parse(metin);
            sohbetAlani.appendChild(div);
            sohbetAlani.scrollTop = sohbetAlani.scrollHeight;
        }

        async function gonder() {
            const soru = inputEl.value.trim();
            if (!soru) return;
            inputEl.value = '';
            mesajEkle(soru, 'kullanici');

            // 1. KÜTÜPHANE KONTROLÜ (Eğitilmiş Veri Seti & Fuse.js)
            const eslesme = fuse.search(soru);
            if (eslesme.length > 0) {
                mesajEkle(eslesme[0].item.cevap, 'bot', `📚 ${eslesme[0].item.kaynak || '1. Kütüphane: Eğitilmiş Hafıza'}`);
                return;
            }

            // 2. KÜTÜPHANE KONTROLÜ (Açık Kaynak Bilgi Bankası)
            const bilgi = await bilgiBankasiAra(soru);
            if (bilgi) {
                mesajEkle(bilgi, 'bot', '🌐 2. Kütüphane: Canlı Bilgi Bankası');
                return;
            }

            // 3. KÜTÜPHANE KONTROLÜ (Yerel Mantık, Hesaplama ve Sohbet Motoru)
            const uretilen = mantikMotoru(soru);
            mesajEkle(uretilen, 'bot', '🧠 3. Kütüphane: Akıllı Mantık Motoru');
        }

        btnEl.onclick = gonder;
        inputEl.onkeypress = (e) => { if (e.key === 'Enter') gonder(); };
    </script>
</body>
</html>
